<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Angie's After School Lessons</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
</head>
<body>
    <div id="app">
        <h1>{{ header }}</h1>

        <div class="lesson">
            <h2>{{ lesson.subject }}</h2>
            <p>Location: {{ lesson.location }}</p>
            <p>Price: AED {{ lesson.price }}</p>
            <button v-on:click="addToCart" v-bind:disabled="!canAddToCart">Add to Cart</button>
            <p>Items in cart: {{ cart.length }}</p>
            <p>Spaces: {{ lesson.availability }}</p>
        </div>
    </div>

    <script>
        new Vue({
            el: '#app',
            data: {
                header: 'After School Lessons',
                lesson: {
                    id: 1001,
                    subject: 'Maths',
                    location: 'Dubai',
                    price: 100,
                    availability: 5
                },
                cart: []
            },
            methods: {
                addToCart() {
                    this.cart.push(this.lesson.id);
                    this.lesson.availability--;
                }
            },
            computed: {
                canAddToCart() {
                    return this.lesson.availability > 0;
                }
            }
        });
    </script>
</body>
</html>

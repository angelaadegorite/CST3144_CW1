<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>After School Lessons</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
</head>
<body>
    <div id="app">
        <h1>{{ header }}</h1>

        
        <button v-on:click="toggleCart" v-bind:disabled="numberOfItems < 1">
            Checkout ({{ numberOfItems }})
        </button>
    
        <div v-if="!displayCart">
            <div class="lesson">
                <h2>{{ lesson.subject }}</h2>
                <p>Location: {{ lesson.location }}</p>
                <p>Price: AED {{ lesson.price }}</p>
                <p>Spaces: {{ lesson.availability }}</p>
                <button v-on:click="addToCart" v-bind:disabled="!canAddToCart">Add to Cart</button>
            </div>
        </div>

        
        <div v-else>
            <h2>Checkout</h2>
            <p>Your checkout page will go here.</p>
        </div>
    </div>

    <script>
        new Vue({
            el: '#app',
            data: {
                header: 'After School Lessons',
                lesson: {
                    id: 1001,
                    subject: 'Maths',
                    location: 'Dubai',
                    price: 100,
                    availability: 5
                },
                cart: [],
                displayCart: false   
            },
            methods: {
                addToCart() {
                    this.cart.push(this.lesson.id);
                    this.lesson.availability--;
                },
                toggleCart() {     
                    this.displayCart = !this.displayCart;
                }
            },
            computed: {
                canAddToCart() {
                    return this.lesson.availability > 0;
                },
                numberOfItems() {    
                    return this.cart.length;
                }
            }
        });
    </script>
</body>
</html>
